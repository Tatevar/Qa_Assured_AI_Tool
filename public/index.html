<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QA Assured AI Tool</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --text: #17202a;
        --muted: #667085;
        --border: #d8dee8;
        --accent: #0f766e;
        --accent-hover: #115e59;
        --danger: #b42318;
        --danger-bg: #fff1f0;
        --shadow: 0 16px 40px rgba(16, 24, 40, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      main {
        width: min(1040px, calc(100% - 32px));
        margin: 0 auto;
        padding: 40px 0;
      }

      header {
        margin-bottom: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 4vw, 3.1rem);
        line-height: 1.05;
        letter-spacing: 0;
      }

      header p {
        margin: 0;
        max-width: 760px;
        color: var(--muted);
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 20px;
      }

      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        border-bottom: 1px solid var(--border);
      }

      .tab-button {
        min-height: 40px;
        border: 1px solid transparent;
        border-bottom: 0;
        border-radius: 8px 8px 0 0;
        padding: 0 14px;
        color: var(--muted);
        background: transparent;
      }

      .tab-button:hover:not(:disabled) {
        color: var(--text);
        background: #eef2f6;
      }

      .tab-button.active {
        border-color: var(--border);
        color: var(--text);
        background: var(--panel);
      }

      .tab-panel[hidden] {
        display: none;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .auth-panel,
      form,
      .result-panel {
        padding: 22px;
      }

      .auth-panel {
        display: grid;
        gap: 14px;
        margin-bottom: 20px;
      }

      .auth-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }

      .auth-row input {
        min-height: 42px;
        min-width: 220px;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0 12px;
        font: inherit;
      }

      .auth-status {
        color: var(--muted);
        font-weight: 700;
      }

      .field {
        display: grid;
        gap: 8px;
        margin-bottom: 18px;
      }

      label {
        font-weight: 700;
      }

      textarea {
        width: 100%;
        min-height: 120px;
        resize: vertical;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 14px;
        color: var(--text);
        font: inherit;
        background: #ffffff;
      }

      textarea:focus,
      input:focus {
        border-color: var(--accent);
        outline: 3px solid rgba(15, 118, 110, 0.16);
      }

      .file-upload {
        display: grid;
        gap: 10px;
      }

      .file-input {
        width: 100%;
        min-height: 44px;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        color: var(--text);
        background: #ffffff;
        font: inherit;
      }

      .attachment-preview {
        display: none;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px;
        background: #fbfcfe;
      }

      .attachment-preview.visible {
        display: grid;
      }

      .attachment-detail {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 10px;
      }

      .attachment-thumb {
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        flex: 0 0 56px;
        object-fit: cover;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #ffffff;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
      }

      .attachment-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 700;
      }

      .attachment-meta {
        color: var(--muted);
        font-size: 0.86rem;
      }

      .clear-attachment-button {
        min-height: 34px;
        padding: 0 10px;
        background: #667085;
        font-size: 0.86rem;
      }

      .clear-attachment-button:hover:not(:disabled) {
        background: #344054;
      }

      .actions,
      .download-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .actions {
        margin-top: 4px;
      }

      button {
        min-height: 44px;
        border: 0;
        border-radius: 8px;
        padding: 0 16px;
        color: #ffffff;
        background: var(--accent);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: var(--accent-hover);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.62;
      }

      .secondary-button,
      .download-actions button {
        background: #344054;
      }

      .secondary-button:hover:not(:disabled),
      .download-actions button:hover:not(:disabled) {
        background: #1d2939;
      }

      .download-actions {
        display: none;
        margin-bottom: 12px;
      }

      .download-actions.visible {
        display: flex;
      }

      .hidden {
        display: none !important;
      }

      .history-panel {
        display: none;
        margin: -4px 0 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #ffffff;
      }

      .history-panel.visible {
        display: block;
      }

      .history-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
      }

      .history-header h3 {
        margin: 0;
        font-size: 0.98rem;
      }

      .history-clear {
        min-height: 32px;
        padding: 0 10px;
        background: #667085;
        font-size: 0.84rem;
      }

      .history-list {
        display: grid;
      }

      .history-item {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        align-items: center;
        gap: 10px;
        border: 0;
        border-bottom: 1px solid var(--border);
        border-radius: 0;
        padding: 10px 14px;
        color: var(--text);
        background: #ffffff;
        text-align: left;
        font-weight: 600;
      }

      .history-item:last-child {
        border-bottom: 0;
      }

      .history-item:hover {
        background: #f6f7f9;
      }

      .history-date {
        color: var(--muted);
        font-size: 0.84rem;
        font-weight: 500;
      }

      .history-type {
        border-radius: 999px;
        padding: 3px 8px;
        color: #344054;
        background: #eef2f6;
        font-size: 0.78rem;
        font-weight: 700;
      }

      .result-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      h2 {
        margin: 0;
        font-size: 1.1rem;
      }

      .status {
        color: var(--muted);
        font-size: 0.94rem;
      }

      .error {
        display: none;
        margin-bottom: 12px;
        border: 1px solid #fecdca;
        border-radius: 8px;
        padding: 12px 14px;
        color: var(--danger);
        background: var(--danger-bg);
        font-weight: 700;
      }

      .error.visible {
        display: block;
      }

      .result-content {
        min-height: 180px;
        max-height: 560px;
        margin: 0;
        overflow: auto;
        word-break: break-word;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
        background: #fbfcfe;
        color: #243041;
        font-size: 0.98rem;
      }

      .result-content > :first-child {
        margin-top: 0;
      }

      .result-content > :last-child {
        margin-bottom: 0;
      }

      .result-content h1,
      .result-content h2,
      .result-content h3 {
        margin: 18px 0 8px;
        line-height: 1.25;
      }

      .result-content h1 {
        font-size: 1.45rem;
      }

      .result-content h2 {
        font-size: 1.25rem;
      }

      .result-content h3 {
        font-size: 1.08rem;
      }

      .result-content p {
        margin: 0 0 10px;
      }

      .result-content ul,
      .result-content ol {
        margin: 8px 0 12px;
        padding-left: 24px;
      }

      .result-content li {
        margin-bottom: 6px;
      }

      @media (max-width: 640px) {
        main {
          width: min(100% - 24px, 1040px);
          padding: 24px 0;
        }

        .auth-panel,
        form,
        .result-panel {
          padding: 16px;
        }

        .actions,
        .download-actions,
        .auth-row {
          display: grid;
        }

        .tabs {
          display: grid;
          border-bottom: 0;
        }

        .tab-button {
          border: 1px solid var(--border);
          border-radius: 8px;
        }

        button,
        .auth-row input {
          width: 100%;
        }

        .history-item {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>QA Assured AI Tool</h1>
        <p>Generate requirements analysis, test documentation, and developer-ready bug reports from QA notes.</p>
      </header>

      <section class="panel auth-panel">
        <div class="auth-row">
          <span id="authStatus" class="auth-status">Working as guest. Login to sync data across devices.</span>
        </div>
        <div id="authForm" class="auth-row">
          <input id="authEmail" type="email" autocomplete="email" placeholder="Email" />
          <input id="authPassword" type="password" autocomplete="current-password" placeholder="Password, min 8 chars" />
          <button type="button" id="loginButton">Login</button>
          <button type="button" id="showRegisterButton" class="secondary-button">Create Account</button>
        </div>
        <div id="registerForm" class="auth-row hidden">
          <input id="registerEmail" type="email" autocomplete="email" placeholder="Email" />
          <input id="registerPassword" type="password" autocomplete="new-password" placeholder="Password, min 8 chars" />
          <input id="registerConfirmPassword" type="password" autocomplete="new-password" placeholder="Confirm password" />
          <button type="button" id="registerButton">Register</button>
          <button type="button" id="cancelRegisterButton" class="secondary-button">Cancel</button>
        </div>
        <div id="signedInActions" class="auth-row hidden">
          <button type="button" id="logoutButton" class="secondary-button">Logout</button>
        </div>
        <div id="authError" class="error"></div>
      </section>

      <div class="workspace">
        <div class="tabs" role="tablist" aria-label="QA workspace">
          <button type="button" id="requirementsTab" class="tab-button active" role="tab" aria-selected="true" aria-controls="requirementsPanel" data-tab="requirements">Requirements analysis / Test documentation</button>
          <button type="button" id="bugTab" class="tab-button" role="tab" aria-selected="false" aria-controls="bugPanel" data-tab="bug">Bug creation</button>
        </div>

        <section id="requirementsPanel" class="panel tab-panel" role="tabpanel" aria-labelledby="requirementsTab">
          <form id="qaForm">
            <div class="field">
              <label for="taskDescription">Task Description</label>
              <textarea id="taskDescription" name="taskDescription" required placeholder="Paste the feature request, bug ticket, or product task here."></textarea>
            </div>

            <div class="field">
              <label for="additionalContext">Additional Context</label>
              <textarea id="additionalContext" name="additionalContext" placeholder="Add acceptance criteria, constraints, designs, API notes, or known assumptions."></textarea>
            </div>

            <div class="field">
              <label for="clarificationAnswers">Clarification Answers</label>
              <textarea id="clarificationAnswers" name="clarificationAnswers" placeholder="Add answers from product, design, engineering, or stakeholders."></textarea>
            </div>

            <div class="field">
              <label for="qaseCsvUpload">Qase CSV Upload</label>
              <div class="file-upload">
                <input id="qaseCsvUpload" class="file-input" name="qaseCsvUpload" type="file" accept="text/csv,.csv" />
                <div id="qaseCsvPreview" class="attachment-preview" aria-live="polite"></div>
              </div>
            </div>

            <div class="actions">
              <button type="button" data-endpoint="/api/qa/analyze-story" data-result-key="analysis">Analyze Story</button>
              <button type="button" data-endpoint="/api/qa/generate-questions" data-result-key="questions">Generate Questions</button>
              <button type="button" data-endpoint="/api/qa/generate-checklist" data-result-key="checklist">Generate Checklist</button>
              <button type="button" data-endpoint="/api/qa/generate-test-cases" data-result-key="testCases">Generate Test Cases</button>
              <button type="button" data-endpoint="/api/qa/analyze-risks" data-result-key="risks">Analyze Risks</button>
              <button type="button" id="historyButton" class="secondary-button">History</button>
            </div>
          </form>
        </section>

        <section id="bugPanel" class="panel tab-panel" role="tabpanel" aria-labelledby="bugTab" hidden>
          <form id="bugForm">
            <div class="field">
              <label for="issueDescription">Issue Description</label>
              <textarea id="issueDescription" name="issueDescription" required placeholder="Describe the issue, environment, steps, actual result, expected result, payment method, device, browser, account type, or any evidence you have."></textarea>
            </div>

            <div class="field">
              <label for="bugClarificationAnswers">Additional Details</label>
              <textarea id="bugClarificationAnswers" name="bugClarificationAnswers" placeholder="Add any extra investigation notes before creating the bug report."></textarea>
            </div>

            <div class="field">
              <label for="bugAttachment">File / Screenshot Upload</label>
              <div class="file-upload">
                <input id="bugAttachment" class="file-input" name="bugAttachment" type="file" accept="image/png,image/jpeg,image/webp,image/gif,text/plain,text/csv,application/json,.log,.pdf" />
                <div id="bugAttachmentPreview" class="attachment-preview" aria-live="polite"></div>
              </div>
            </div>

            <div class="actions">
              <button type="button" data-endpoint="/api/qa/generate-bug-report" data-result-key="bugReport" data-payload-source="bug">Generate Bug Report</button>
              <button type="button" id="bugHistoryButton" class="secondary-button">History</button>
            </div>
          </form>
        </section>

        <section class="panel result-panel" aria-live="polite">
          <div class="result-heading">
            <h2>Result</h2>
            <span id="status" class="status">Ready</span>
          </div>
          <div id="downloadActions" class="download-actions">
            <button type="button" id="downloadButton">Download</button>
            <button type="button" id="downloadCsvButton">Download Qase CSV</button>
          </div>
          <div id="historyPanel" class="history-panel">
            <div class="history-header">
              <h3>Latest Generations</h3>
              <button type="button" id="clearHistoryButton" class="history-clear">Clear</button>
            </div>
            <div id="historyList" class="history-list"></div>
          </div>
          <div id="error" class="error"></div>
          <div id="result" class="result-content">Results will appear here.</div>
        </section>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
    <script>
      const qaForm = document.querySelector('#qaForm');
      const bugForm = document.querySelector('#bugForm');
      const tabButtons = [...document.querySelectorAll('.tab-button')];
      const tabPanels = [...document.querySelectorAll('.tab-panel')];
      const generatorButtons = [...document.querySelectorAll('button[data-endpoint]')];
      const statusEl = document.querySelector('#status');
      const errorEl = document.querySelector('#error');
      const authErrorEl = document.querySelector('#authError');
      const resultEl = document.querySelector('#result');
      const downloadActions = document.querySelector('#downloadActions');
      const downloadButton = document.querySelector('#downloadButton');
      const downloadCsvButton = document.querySelector('#downloadCsvButton');
      const historyButton = document.querySelector('#historyButton');
      const bugHistoryButton = document.querySelector('#bugHistoryButton');
      const historyPanel = document.querySelector('#historyPanel');
      const historyList = document.querySelector('#historyList');
      const clearHistoryButton = document.querySelector('#clearHistoryButton');
      const authStatus = document.querySelector('#authStatus');
      const authForm = document.querySelector('#authForm');
      const registerForm = document.querySelector('#registerForm');
      const signedInActions = document.querySelector('#signedInActions');
      const authEmail = document.querySelector('#authEmail');
      const authPassword = document.querySelector('#authPassword');
      const registerEmail = document.querySelector('#registerEmail');
      const registerPassword = document.querySelector('#registerPassword');
      const registerConfirmPassword = document.querySelector('#registerConfirmPassword');
      const loginButton = document.querySelector('#loginButton');
      const showRegisterButton = document.querySelector('#showRegisterButton');
      const registerButton = document.querySelector('#registerButton');
      const cancelRegisterButton = document.querySelector('#cancelRegisterButton');
      const logoutButton = document.querySelector('#logoutButton');
      const qaseCsvInput = document.querySelector('#qaseCsvUpload');
      const qaseCsvPreview = document.querySelector('#qaseCsvPreview');
      const bugAttachmentInput = document.querySelector('#bugAttachment');
      const bugAttachmentPreview = document.querySelector('#bugAttachmentPreview');

      const LOCAL_HISTORY_KEY = 'qaToolArtifactHistory';
      const LOCAL_DRAFT_KEY = 'qaToolFormDraft';
      const LOCAL_CURRENT_KEY = 'qaToolCurrentArtifact';
      const LOCAL_LEGACY_TEST_CASE_HISTORY_KEY = 'qaToolTestCaseHistory';
      const MAX_QASE_CSV_BYTES = 2.5 * 1024 * 1024;
      const MAX_BUG_ATTACHMENT_BYTES = 2.5 * 1024 * 1024;
      const MAX_ATTACHMENT_TEXT_CHARS = 12000;
      const MAX_QASE_EXISTING_CASES = 40;
      const READABLE_ATTACHMENT_TYPES = new Set(['application/json', 'text/csv', 'text/plain']);
      const artifactLabels = {
        analysis: 'Analyze Story',
        questions: 'Generate Questions',
        checklist: 'Generate Checklist',
        testCases: 'Generate Test Cases',
        risks: 'Analyze Risks',
        bugReport: 'Generate Bug Report',
      };
      const HISTORY_LIMIT = 30;

      let currentUser = null;
      let serverHistory = [];
      let qaseCsvContext = null;
      let bugAttachment = null;
      let currentArtifact = {
        key: '',
        label: '',
        text: '',
        qaseCsvContext: null,
      };
      let activeTab = 'requirements';
      let draftTimer;

      function apiFetch(url, options = {}) {
        const headers = {
          ...(options.body ? { 'Content-Type': 'application/json' } : {}),
          ...(options.headers || {}),
        };

        return fetch(url, {
          credentials: 'include',
          ...options,
          headers,
        });
      }

      async function readJsonResponse(response) {
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          const details = data.details ? ` ${data.details}` : '';
          throw new Error(`${data.message || `Request failed with status ${response.status}.`}${details}`);
        }

        return data;
      }

      function formatFileSize(bytes) {
        if (!Number.isFinite(bytes) || bytes <= 0) {
          return 'Unknown size';
        }

        const units = ['B', 'KB', 'MB'];
        let size = bytes;
        let unitIndex = 0;

        while (size >= 1024 && unitIndex < units.length - 1) {
          size /= 1024;
          unitIndex += 1;
        }

        return `${size.toFixed(size >= 10 || unitIndex === 0 ? 0 : 1)} ${units[unitIndex]}`;
      }

      function readFile(file, mode) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();

          reader.addEventListener('load', () => resolve(reader.result));
          reader.addEventListener('error', () => reject(new Error('Unable to read attachment.')));

          if (mode === 'text') {
            reader.readAsText(file);
          } else {
            reader.readAsDataURL(file);
          }
        });
      }

      function parseCsv(text) {
        const rows = [];
        let row = [];
        let field = '';
        let inQuotes = false;
        const source = String(text || '').replace(/^\uFEFF/, '');

        for (let index = 0; index < source.length; index += 1) {
          const char = source[index];
          const nextChar = source[index + 1];

          if (char === '"') {
            if (inQuotes && nextChar === '"') {
              field += '"';
              index += 1;
            } else {
              inQuotes = !inQuotes;
            }
            continue;
          }

          if (char === ',' && !inQuotes) {
            row.push(field);
            field = '';
            continue;
          }

          if ((char === '\n' || char === '\r') && !inQuotes) {
            if (char === '\r' && nextChar === '\n') {
              index += 1;
            }
            row.push(field);
            if (row.some((value) => value.trim())) {
              rows.push(row);
            }
            row = [];
            field = '';
            continue;
          }

          field += char;
        }

        row.push(field);
        if (row.some((value) => value.trim())) {
          rows.push(row);
        }

        return rows;
      }

      function rowToObject(headers, row) {
        return headers.reduce((record, header, index) => {
          record[header] = row[index] || '';
          return record;
        }, {});
      }

      function compactRecord(record = {}) {
        return Object.fromEntries(Object.entries(record).filter(([, value]) => Boolean(value)));
      }

      function buildQaseCsvContextFromRows(file, rows) {
        const headers = rows[0] || [];
        const headerSet = new Set(headers);

        if ((!headerSet.has('id') && !headerSet.has('v2.id')) || !headerSet.has('title') || !headerSet.has('suite')) {
          throw new Error('Qase CSV must include id, title, and suite columns.');
        }

        const records = rows.slice(1).map((row) => rowToObject(headers, row));
        const caseRecords = records.filter((record) => record.title);
        const suiteRecord = records.find((record) => {
          return record.suite && (!record.title || record.suite_without_cases === '1');
        }) || records.find((record) => record.suite) || {};
        const defaultRecord = caseRecords[0] || suiteRecord;

        return {
          name: file.name,
          size: file.size,
          rowCount: rows.length - 1,
          caseCount: caseRecords.length,
          headers,
          suite: compactRecord({
            id: suiteRecord.suite_id,
            parentId: suiteRecord.suite_parent_id,
            name: suiteRecord.suite,
            withoutCases: suiteRecord.suite_without_cases,
          }),
          milestone: compactRecord({
            id: suiteRecord.milestone_id || defaultRecord.milestone_id,
            name: suiteRecord.milestone || defaultRecord.milestone,
          }),
          defaults: compactRecord({
            priority: defaultRecord.priority,
            severity: defaultRecord.severity,
            type: defaultRecord.type,
            behavior: defaultRecord.behavior,
            automation: defaultRecord.automation,
            status: defaultRecord.status,
            isFlaky: defaultRecord.is_flaky,
            layer: defaultRecord.layer,
            stepsType: defaultRecord.steps_type,
            isMuted: defaultRecord.is_muted,
          }),
          existingCases: caseRecords.slice(0, MAX_QASE_EXISTING_CASES).map((record) => compactRecord({
            id: record.id || record['v2.id'],
            title: record.title,
            description: record.description,
            priority: record.priority,
            severity: record.severity,
            type: record.type,
            behavior: record.behavior,
          })),
        };
      }

      async function buildQaseCsvContext(file) {
        if (!file) {
          return null;
        }

        if (file.size > MAX_QASE_CSV_BYTES) {
          throw new Error('Qase CSV must be 2.5 MB or smaller.');
        }

        if (!/\.csv$/i.test(file.name) && file.type !== 'text/csv') {
          throw new Error('Upload a CSV file exported from Qase.');
        }

        return buildQaseCsvContextFromRows(file, parseCsv(await readFile(file, 'text')));
      }

      function isReadableAttachment(file) {
        return READABLE_ATTACHMENT_TYPES.has(file.type) || /\.(csv|json|log|txt)$/i.test(file.name);
      }

      async function buildBugAttachment(file) {
        if (!file) {
          return null;
        }

        if (file.size > MAX_BUG_ATTACHMENT_BYTES) {
          throw new Error('Attachment must be 2.5 MB or smaller.');
        }

        const attachment = {
          name: file.name,
          type: file.type || 'Unknown type',
          size: file.size,
          kind: 'file',
        };

        if (file.type.startsWith('image/')) {
          return {
            ...attachment,
            kind: 'image',
            dataUrl: await readFile(file, 'dataUrl'),
          };
        }

        if (isReadableAttachment(file)) {
          return {
            ...attachment,
            kind: 'text',
            text: String(await readFile(file, 'text')).slice(0, MAX_ATTACHMENT_TEXT_CHARS),
          };
        }

        return attachment;
      }

      function slugify(value) {
        return value
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-|-$/g, '')
          .slice(0, 60) || 'qa-artifact';
      }

      function downloadBlob(filename, blob) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');

        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      function downloadFile(filename, content, mimeType) {
        downloadBlob(filename, new Blob([content], { type: mimeType }));
      }

      function stripMarkdown(value) {
        return String(value || '')
          .replace(/\*\*(.*?)\*\*/g, '$1')
          .replace(/__(.*?)__/g, '$1')
          .replace(/`([^`]+)`/g, '$1')
          .replace(/\[(.*?)\]\((.*?)\)/g, '$1')
          .trim();
      }

      function markdownToDocxParagraphs(markdownText) {
        const {
          HeadingLevel,
          Paragraph,
          TextRun,
        } = window.docx;
        const paragraphs = [];

        String(markdownText || '').split(/\r?\n/).forEach((line) => {
          const trimmed = line.trim();

          if (!trimmed) {
            paragraphs.push(new Paragraph({ text: '' }));
            return;
          }

          if (trimmed.startsWith('### ')) {
            paragraphs.push(new Paragraph({
              heading: HeadingLevel.HEADING_3,
              children: [new TextRun(stripMarkdown(trimmed.replace(/^###\s+/, '')))],
            }));
            return;
          }

          if (trimmed.startsWith('## ')) {
            paragraphs.push(new Paragraph({
              heading: HeadingLevel.HEADING_2,
              children: [new TextRun(stripMarkdown(trimmed.replace(/^##\s+/, '')))],
            }));
            return;
          }

          if (trimmed.startsWith('# ')) {
            paragraphs.push(new Paragraph({
              heading: HeadingLevel.HEADING_1,
              children: [new TextRun(stripMarkdown(trimmed.replace(/^#\s+/, '')))],
            }));
            return;
          }

          if (/^[-*]\s+/.test(trimmed)) {
            paragraphs.push(new Paragraph({
              bullet: { level: 0 },
              children: [new TextRun(stripMarkdown(trimmed.replace(/^[-*]\s+/, '')))],
            }));
            return;
          }

          paragraphs.push(new Paragraph({
            children: [new TextRun(stripMarkdown(trimmed))],
          }));
        });

        return paragraphs;
      }

      async function buildDocxBlob(markdownText) {
        if (!window.docx) {
          throw new Error('DOCX generator failed to load. Check your internet connection and refresh the page.');
        }

        const {
          Document,
          Packer,
        } = window.docx;
        const document = new Document({
          creator: 'QA Assured AI Tool',
          title: currentArtifact.label || 'QA Artifact',
          sections: [
            {
              children: markdownToDocxParagraphs(markdownText),
            },
          ],
        });

        return Packer.toBlob(document);
      }

      function csvEscape(value) {
        const text = String(value || '').replace(/\r?\n/g, '\n');
        return `"${text.replace(/"/g, '""')}"`;
      }

      const QASE_CSV_HEADERS = [
        'id',
        'title',
        'description',
        'preconditions',
        'postconditions',
        'tags',
        'priority',
        'severity',
        'type',
        'behavior',
        'automation',
        'status',
        'is_flaky',
        'layer',
        'steps_type',
        'steps_actions',
        'steps_result',
        'steps_data',
        'milestone_id',
        'milestone',
        'suite_id',
        'suite_parent_id',
        'suite',
        'suite_without_cases',
        'parameters',
        'is_muted',
      ];
      const TEST_CASE_FIELD_LABELS = [
        'Title',
        'Description',
        'Priority',
        'Severity',
        'Preconditions',
        'Test Data',
        'Steps',
        'Expected Result',
        'Postconditions',
        'Type',
        'Qase Type',
        'Behavior',
        'Tags',
        'Parameters',
      ];

      function escapeRegExp(value) {
        return String(value).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      }

      function readField(block, label) {
        const fieldPattern = TEST_CASE_FIELD_LABELS.map(escapeRegExp).join('|');
        const nextCasePattern = '\\n\\s*(?:#{1,6}\\s*)?(?:\\*\\*)?TC[-\\s]?\\d+';
        const pattern = new RegExp(`(?:^|\\n)-\\s*${escapeRegExp(label)}:\\s*([\\s\\S]*?)(?=\\n-\\s*(?:${fieldPattern}):|${nextCasePattern}|$)`, 'i');
        const match = block.match(pattern);
        return match ? match[1].trim() : '';
      }

      function readSteps(block) {
        return readField(block, 'Steps');
      }

      function normalizeToken(value) {
        return stripMarkdown(value)
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-|-$/g, '');
      }

      function normalizePriority(value, fallback = 'medium') {
        const token = normalizeToken(value || fallback);

        if (token.includes('high')) {
          return 'high';
        }

        if (token.includes('low')) {
          return 'low';
        }

        if (token.includes('medium')) {
          return 'medium';
        }

        return token || fallback;
      }

      function normalizeSeverity(value, fallback = 'normal') {
        const token = normalizeToken(value || fallback);
        const allowed = ['blocker', 'critical', 'major', 'normal', 'minor', 'trivial'];

        if (allowed.includes(token)) {
          return token;
        }

        if (token.includes('high')) {
          return 'major';
        }

        if (token.includes('medium')) {
          return 'normal';
        }

        if (token.includes('low')) {
          return 'minor';
        }

        return fallback;
      }

      function normalizeQaseType(value, fallback = 'other') {
        const token = normalizeToken(value || fallback);
        const allowed = ['functional', 'regression', 'security', 'performance', 'usability', 'other'];

        if (allowed.includes(token)) {
          return token;
        }

        if (token.includes('regression')) {
          return 'regression';
        }

        return fallback;
      }

      function normalizeBehavior(value, fallback = 'positive') {
        const token = normalizeToken(value || fallback);

        if (token.includes('destructive')) {
          return 'destructive';
        }

        if (token.includes('negative') || token.includes('edge')) {
          return 'negative';
        }

        if (token.includes('positive') || token.includes('regression')) {
          return 'positive';
        }

        return fallback;
      }

      function normalizeTags(value, type) {
        const tags = String(value || type || '')
          .split(',')
          .map((tag) => normalizeToken(tag))
          .filter(Boolean);

        return [...new Set(tags)].join(',');
      }

      function cleanMultiline(value) {
        return String(value || '')
          .split(/\r?\n/)
          .map((line) => stripMarkdown(line).replace(/^\s*[-*]\s+/, '').trim())
          .filter(Boolean)
          .join('\n');
      }

      function parseNumberedItems(value) {
        const items = [];

        cleanMultiline(value).split('\n').forEach((line) => {
          const match = line.match(/^(\t*)\d+\.\s*(.*)$/);

          if (match) {
            items.push({
              indent: match[1] || '',
              text: match[2].trim(),
            });
            return;
          }

          if (items.length) {
            items[items.length - 1].text = `${items[items.length - 1].text}\n${line}`;
          } else if (line.trim()) {
            items.push({
              indent: '',
              text: line.trim(),
            });
          }
        });

        return items.filter((item) => item.text);
      }

      function formatQaseV2StepColumn(values, count) {
        return Array.from({ length: count }, (_, index) => {
          const item = values[index] || { indent: '', text: '' };

          return `${item.indent}${index + 1}. ${item.text || ''}`;
        }).join('\n');
      }

      function buildQaseV2Steps(testCase) {
        const actionItems = parseNumberedItems(testCase.steps);
        const resultItems = parseNumberedItems(testCase.expectedResult);
        const dataItems = parseNumberedItems(testCase.testData);
        const stepCount = Math.max(actionItems.length, resultItems.length, dataItems.length, 1);
        const alignedResults = resultItems.length === 1 && stepCount > 1
          ? [...Array.from({ length: stepCount - 1 }, () => ({ indent: '', text: '' })), resultItems[0]]
          : resultItems;
        const alignedData = dataItems.length === 1 && stepCount > 1
          ? [dataItems[0], ...Array.from({ length: stepCount - 1 }, () => ({ indent: '', text: '' }))]
          : dataItems;

        return {
          actions: formatQaseV2StepColumn(actionItems, stepCount),
          results: formatQaseV2StepColumn(alignedResults, stepCount),
          data: formatQaseV2StepColumn(alignedData, stepCount),
        };
      }

      function buildQaseRow(values = {}) {
        return QASE_CSV_HEADERS.map((header) => values[header] || '');
      }

      function getActiveQaseContext() {
        return currentArtifact.qaseCsvContext || qaseCsvContext || null;
      }

      function buildQaseSuiteRow(context) {
        const suite = context?.suite || {};
        const milestone = context?.milestone || {};

        return buildQaseRow({
          milestone_id: milestone.id || '',
          milestone: milestone.name || '',
          suite_id: '1',
          suite_parent_id: '',
          suite: suite.name || 'Generated Test Cases',
          suite_without_cases: '1',
        });
      }

      function buildQaseCaseRow(testCase, context, index) {
        const suite = context?.suite || {};
        const milestone = context?.milestone || {};
        const defaults = context?.defaults || {};
        const type = testCase.type || 'Positive';
        const steps = buildQaseV2Steps(testCase);

        return buildQaseRow({
          id: String(index + 1),
          title: testCase.title,
          description: testCase.description,
          preconditions: testCase.preconditions,
          postconditions: testCase.postconditions,
          tags: normalizeTags(testCase.tags, type),
          priority: normalizePriority(testCase.priority, defaults.priority || 'medium'),
          severity: normalizeSeverity(testCase.severity, defaults.severity || 'normal'),
          type: normalizeQaseType(testCase.qaseType, defaults.type || 'other'),
          behavior: normalizeBehavior(testCase.behavior || type, defaults.behavior === 'undefined' ? 'positive' : defaults.behavior || 'positive'),
          automation: defaults.automation || 'is-not-automated',
          status: defaults.status || 'actual',
          is_flaky: defaults.isFlaky || 'no',
          layer: defaults.layer || 'unknown',
          steps_type: defaults.stepsType || 'classic',
          steps_actions: steps.actions,
          steps_result: steps.results,
          steps_data: steps.data,
          milestone_id: milestone.id || '',
          milestone: milestone.name || '',
          suite_id: '1',
          suite_parent_id: '',
          suite: suite.name || 'Generated Test Cases',
          suite_without_cases: '',
          parameters: testCase.parameters,
          is_muted: defaults.isMuted || 'no',
        });
      }

      function getTestCaseBlocks(text) {
        const normalized = String(text || '').trim();
        const headingPattern = /(?:^|\n)\s*(?:#{1,6}\s*)?(?:\*\*)?TC[-\s]?\d+\s*(?:[:.\-–—]|\*\*)?/gi;
        const matches = [...normalized.matchAll(headingPattern)];

        if (!matches.length) {
          return normalized ? [normalized] : [];
        }

        return matches.map((match, index) => {
          const start = match.index + (match[0].startsWith('\n') ? 1 : 0);
          const end = matches[index + 1]
            ? matches[index + 1].index + (matches[index + 1][0].startsWith('\n') ? 1 : 0)
            : normalized.length;

          return normalized.slice(start, end).trim();
        }).filter(Boolean);
      }

      function parseTestCases(text) {
        const normalized = String(text || '').trim();
        const blocks = getTestCaseBlocks(normalized);
        const parsed = blocks.map((block, index) => {
          const heading = block.match(/^\s*(?:#{1,6}\s*)?(TC[-\s]?\d+)\s*(?:[:.\-–—]|\*\*)?\s*(.*)$/im);
          const normalizedId = heading?.[1]?.replace(/\s+/g, '-').toUpperCase();

          return {
            id: normalizedId || `TC-${String(index + 1).padStart(3, '0')}`,
            title: heading?.[2]?.trim() || readField(block, 'Title') || `Generated Test Case ${index + 1}`,
            description: readField(block, 'Description'),
            priority: readField(block, 'Priority'),
            severity: readField(block, 'Severity'),
            preconditions: readField(block, 'Preconditions'),
            testData: readField(block, 'Test Data'),
            steps: readSteps(block),
            expectedResult: readField(block, 'Expected Result'),
            postconditions: readField(block, 'Postconditions'),
            type: readField(block, 'Type'),
            qaseType: readField(block, 'Qase Type'),
            behavior: readField(block, 'Behavior'),
            tags: readField(block, 'Tags'),
            parameters: readField(block, 'Parameters'),
          };
        });

        return parsed.length ? parsed : [{
          id: 'TC-001',
          title: 'Generated Test Cases',
          description: '',
          priority: '',
          severity: '',
          preconditions: '',
          testData: '',
          steps: normalized,
          expectedResult: '',
          postconditions: '',
          type: '',
          qaseType: '',
          behavior: '',
          tags: '',
          parameters: '',
        }];
      }

      function buildTestCasesCsv(text) {
        const context = getActiveQaseContext();
        const rows = [
          QASE_CSV_HEADERS,
          buildQaseSuiteRow(context),
          ...parseTestCases(text).map((testCase, index) => buildQaseCaseRow(testCase, context, index)),
        ];

        return [
          QASE_CSV_HEADERS.join(','),
          ...rows.slice(1).map((row) => row.map(csvEscape).join(',')),
        ].join('\r\n');
      }

      async function requestArtifact(button) {
        const payload = getButtonPayload(button);
        const isBugFlow = button.dataset.payloadSource === 'bug';

        clearError();
        setDownloadState();

        if (isBugFlow && !payload.issueDescription) {
          showError('Issue Description is required.');
          renderResult('Add an issue description, then choose an action.');
          return;
        }

        if (!isBugFlow && !payload.taskDescription) {
          showError('Task Description is required.');
          renderResult('Add a task description, then choose an action.');
          return;
        }

        setLoading(true, button.textContent);
        renderResult('Generating...');

        try {
          const data = await readJsonResponse(await apiFetch(button.dataset.endpoint, {
            method: 'POST',
            body: JSON.stringify(payload),
          }));
          const resultText = data[button.dataset.resultKey] || 'No result returned.';

          renderResult(resultText);
          setDownloadState({
            key: button.dataset.resultKey,
            label: button.textContent,
            text: resultText,
            qaseCsvContext: payload.qaseCsvContext || null,
          });
          persistCurrentArtifact();
          await saveArtifactHistory(button.dataset.resultKey, button.textContent, resultText, payload);
        } catch (err) {
          showError(err.message || 'Something went wrong.');
          renderResult('Unable to generate a result.');
        } finally {
          setLoading(false);
        }
      }

      function showRegisterForm() {
        clearAuthError();
        registerEmail.value = authEmail.value;
        registerPassword.value = '';
        registerConfirmPassword.value = '';
        authForm.classList.add('hidden');
        registerForm.classList.remove('hidden');
        authStatus.textContent = 'Create an account to sync drafts and history across devices.';
      }

      function showLoginForm() {
        clearAuthError();
        authForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        authStatus.textContent = 'Working as guest. Login to sync data across devices.';
      }

      async function login() {
        clearAuthError();

        try {
          const data = await readJsonResponse(await apiFetch('/api/auth/login', {
            method: 'POST',
            body: JSON.stringify({
              email: authEmail.value,
              password: authPassword.value,
            }),
          }));

          currentUser = data.user;
          updateAuthUi();
          await loadServerDraft();
          await loadServerHistory();
          renderHistoryList();
          saveDraft();
          statusEl.textContent = 'Logged in';
        } catch (err) {
          showAuthError(err.message || 'Login failed.');
        }
      }

      async function register() {
        clearAuthError();

        if (registerPassword.value !== registerConfirmPassword.value) {
          showAuthError('Passwords do not match.');
          return;
        }

        try {
          const data = await readJsonResponse(await apiFetch('/api/auth/register', {
            method: 'POST',
            body: JSON.stringify({
              email: registerEmail.value,
              password: registerPassword.value,
            }),
          }));

          currentUser = data.user;
          authEmail.value = registerEmail.value;
          authPassword.value = '';
          updateAuthUi();
          await loadServerDraft();
          await loadServerHistory();
          renderHistoryList();
          saveDraft();
          statusEl.textContent = 'Account created';
        } catch (err) {
          showAuthError(err.message || 'Registration failed.');
        }
      }

      async function logout() {
        clearAuthError();

        try {
          await apiFetch('/api/auth/logout', {
            method: 'POST',
          });
        } catch {
          // Continue local logout even if the server session is already gone.
        }

        currentUser = null;
        serverHistory = [];
        updateAuthUi();
        restoreLocalDraft();
        renderHistoryList();
        statusEl.textContent = 'Logged out';
      }

      async function initializeAuth() {
        try {
          const data = await readJsonResponse(await apiFetch('/api/auth/me'));
          currentUser = data.user;
          updateAuthUi();

          if (currentUser) {
            await loadServerDraft();
            await loadServerHistory();
          }
        } catch {
          currentUser = null;
          updateAuthUi();
        }
      }

      generatorButtons.forEach((button) => {
        button.addEventListener('click', () => requestArtifact(button));
      });

      tabButtons.forEach((button) => {
        button.addEventListener('click', () => setActiveTab(button.dataset.tab));
      });

      [
        qaForm.taskDescription,
        qaForm.additionalContext,
        qaForm.clarificationAnswers,
        bugForm.issueDescription,
        bugForm.bugClarificationAnswers,
      ].forEach((field) => {
        field.addEventListener('input', saveDraft);
      });

      qaseCsvInput.addEventListener('change', async () => {
        clearError();

        try {
          qaseCsvContext = await buildQaseCsvContext(qaseCsvInput.files?.[0]);
          renderQaseCsvContext();
          saveDraft();
          statusEl.textContent = qaseCsvContext ? 'Qase CSV loaded' : 'Ready';
        } catch (err) {
          qaseCsvContext = null;
          qaseCsvInput.value = '';
          renderQaseCsvContext();
          showError(err.message || 'Unable to load Qase CSV.');
        }
      });

      bugAttachmentInput.addEventListener('change', async () => {
        clearError();

        try {
          bugAttachment = await buildBugAttachment(bugAttachmentInput.files?.[0]);
          renderBugAttachment();
          statusEl.textContent = bugAttachment ? 'File attached' : 'Ready';
        } catch (err) {
          bugAttachment = null;
          bugAttachmentInput.value = '';
          renderBugAttachment();
          showError(err.message || 'Unable to attach file.');
        }
      });

      loginButton.addEventListener('click', login);
      showRegisterButton.addEventListener('click', showRegisterForm);
      registerButton.addEventListener('click', register);
      cancelRegisterButton.addEventListener('click', showLoginForm);
      logoutButton.addEventListener('click', logout);

      historyButton.addEventListener('click', () => {
        renderHistoryList();
        historyPanel.classList.toggle('visible');
      });

      bugHistoryButton.addEventListener('click', () => {
        renderHistoryList();
        historyPanel.classList.toggle('visible');
      });

      clearHistoryButton.addEventListener('click', () => {
        clearHistory().catch((err) => showError(err.message || 'Unable to clear history.'));
      });

      downloadButton.addEventListener('click', async () => {
        try {
          downloadBlob(`${slugify(currentArtifact.label)}.docx`, await buildDocxBlob(currentArtifact.text));
        } catch (err) {
          showError(err.message || 'Unable to create DOCX file.');
        }
      });

      downloadCsvButton.addEventListener('click', () => {
        downloadFile(`${slugify(currentArtifact.label)}-qase.csv`, buildTestCasesCsv(currentArtifact.text), 'text/csv;charset=utf-8');
      });

      migrateLegacyHistory();
      restoreLocalDraft();
      restoreLocalCurrentArtifact();
      initializeAuth()
        .then(() => {
          renderHistoryList();
          setDownloadState(currentArtifact);
        })
        .catch(() => {
          renderHistoryList();
          setDownloadState(currentArtifact);
        });
    </script>
  </body>
</html>
